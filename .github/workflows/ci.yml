name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # aivo-amp links the aivo lib via a path dep (`../aivo` in Cargo.toml) for
      # co-dev, and CI runners have no sibling checkout — so clone aivo's main
      # next to the workspace. aivo is public, so no token is needed. Once
      # Cargo.toml pins the git dep (a release tag), drop this step: cargo
      # fetches the pinned dep itself, same as release.yml.
      - name: Clone sibling aivo (path dependency)
        run: git clone --depth 1 https://github.com/yuanchuan/aivo ../aivo

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Cargo.toml already warns on all clippy lints; promote to errors in CI.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  msrv:
    name: build on MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling aivo (path dependency)
        run: git clone --depth 1 https://github.com/yuanchuan/aivo ../aivo

      # Keep this version in sync with `rust-version` in Cargo.toml.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # `+1.88.0` overrides rust-toolchain.toml (which pins stable) so this job
      # actually exercises the declared MSRV. No `--locked`: the lockfile can't
      # pin a path dep against a moving sibling.
      - name: Build
        run: cargo +1.88.0 build
