name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Cargo.toml already warns on all clippy lints; promote to errors in CI.
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  msrv:
    name: build on MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this version in sync with `rust-version` in Cargo.toml — which the
      # pinned `aivo` dep raises to 1.97, enforced by `--locked` at resolve time.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # `+1.97.0` overrides rust-toolchain.toml (which pins stable) so this
      # job actually exercises the declared MSRV.
      - name: Build
        run: cargo +1.97.0 build --locked
