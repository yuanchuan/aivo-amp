[package]
name = "aivo-amp"
version = "0.1.5"
# MSRV: 1.95 — the floor the pinned `aivo` dep declares (`rust-version =
# "1.95"`), so it's the effective floor for the whole build. Edition 2024 needs
# 1.85; CI's `msrv` job builds on 1.95.0 to guard this.
edition = "2024"
rust-version = "1.95"
authors = ["yuanchuan"]
description = "Sourcegraph Amp support for aivo, as a sibling-binary plugin (aivo amp …)"
license = "MIT"
repository = "https://github.com/yuanchuan/aivo-amp"

[[bin]]
name = "aivo-amp"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"

[dependencies]
# The aivo lib: reuse its key store, routers, http/provider utils, constants.
# Pinned to the public v0.28.0 tag so the plugin builds standalone — what
# `aivo plugins install github:yuanchuan/aivo-amp`, CI, and release.yml compile.
# The usage-accounting helpers the bridge needs are vendored in src/usage.rs, so
# no unreleased aivo API is required. Local aivo co-dev: swap to the path line
# (exactly one must be active).
aivo = { git = "https://github.com/yuanchuan/aivo", tag = "v0.28.0" }
# aivo = { path = "../aivo" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP — features/versions kept compatible with the aivo lib so shared types
# (reqwest::Client, http::HeaderMap) unify across the crate boundary.
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "process", "signal", "time", "fs", "net", "sync", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
anyhow = "1.0"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
