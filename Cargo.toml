[package]
name = "aivo-amp"
version = "0.1.0"
# MSRV: 1.88 is the real floor (let-chains stabilized there); edition 2024
# needs 1.85. Verified to build + test on 1.88.0, so don't bump without a
# reason. Source uses no API newer than 1.88. Note: the pinned `aivo` rev
# declares rust-version = 1.95, but it still compiles on 1.88 (CI's `msrv`
# job guards this) — re-check when bumping the aivo rev below.
edition = "2024"
rust-version = "1.88"
authors = ["yuanchuan"]
description = "Sourcegraph Amp support for aivo, as a sibling-binary plugin (aivo amp …)"
license = "MIT"
repository = "https://github.com/yuanchuan/aivo-amp"

[[bin]]
name = "aivo-amp"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"

[dependencies]
# The aivo lib: reuse its key store, routers, http/provider utils, constants.
#
# Standalone build — what `aivo plugins install github:yuanchuan/aivo-amp` and
# .github/workflows/release.yml compile — uses the *git* dep below, pinned to an
# aivo release tag whose `serve_router` usage helpers (TokenUsage /
# parse_token_usage / StreamUsageSniffer) are `pub`. That exposure ships after
# v0.27.0, so pin the first tag that includes it (expected v0.28.0).
#
# Local co-dev: keep the path line; swap to the git line to test the standalone
# build. Exactly one must be active.
aivo = { path = "../aivo" }
# aivo = { git = "https://github.com/yuanchuan/aivo", tag = "v0.28.0" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP — features/versions kept compatible with the aivo lib so shared types
# (reqwest::Client, http::HeaderMap) unify across the crate boundary.
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "process", "signal", "time", "fs", "net", "sync", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
anyhow = "1.0"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
